<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Search ChatBot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="header-content">
                <h1>
                    <i class="fas fa-robot"></i>
                    AI Web Search Assistant
                </h1>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Online</span>
                </div>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
            <!-- Welcome Message -->
            <div class="message bot-message">
                <div class="message-avatar bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble">
                        <p>Hello! I'm your AI web search assistant. I can search the web in real-time to answer your questions. Ask me anything!</p>
                    </div>
                    <div class="message-timestamp">Just now</div>
                </div>
            </div>
        </div>

        <!-- Typing Indicator (hidden by default) -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <div class="message-avatar bot-avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <form id="chatForm" class="input-form">
                <button type="button" class="emoji-button" title="Emoji">
                    <i class="far fa-smile"></i>
                </button>

                <input
                    type="text"
                    id="messageInput"
                    class="message-input"
                    placeholder="Ask me anything..."
                    autocomplete="off"
                    maxlength="1000"
                    required
                >

                <button type="button" class="attachment-button" title="Attachment">
                    <i class="fas fa-paperclip"></i>
                </button>

                <button type="submit" class="send-button" id="sendButton">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
